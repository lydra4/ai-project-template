name: Claude CI Triage
on:
    workflow_run:
        workflows: ["AI Project CI/CD"] # must match ci-cd.yaml's `name:`
        types: [completed]

jobs:
    triage:
        if: ${{ github.event.workflow_run.conclusion == 'failure' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            issues: write
            actions: read
            id-token: write
        steps:
            - uses: actions/checkout@v6
            - uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: ap-southeast-1
            - uses: anthropics/claude-code-action@v1
              with:
                  use_bedrock: "true"
                  additional_permissions: |
                      actions: read
                  prompt: |
                      The workflow "${{ github.event.workflow_run.name }}" failed on
                      branch ${{ github.event.workflow_run.head_branch }}
                      (run: ${{ github.event.workflow_run.html_url }}).
                      Read the failed job logs, identify the root cause, and post a comment
                      on the related PR or commit explaining the failure and a suggested fix.
                  claude_args: |
                      --model global.anthropic.claude-sonnet-4-5-20250929-v1:0
                      --max-turns 15
