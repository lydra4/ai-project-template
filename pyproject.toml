[project]
name = "temp" # Update
version = "0.1.0"
requires-python = "==3.13"

[tool.ruff]
target-version = "py313" # Depends on python version

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PLC0415"]

[tool.mypy]
python_version = "3.13" # Depends on python version
explicit_package_bases = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests"]
skips = ["B101"]
